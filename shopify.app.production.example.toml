# Production Shopify app configuration example.
# Copy/link this as the production config after creating the production app in
# Shopify Partners. Replace client_id and URLs before using it.

client_id = "2bf6876a2bbf4381c85973f61ddfa5cb"
name = "Discount - Stackmerce"
application_url = "https://YOUR-VERCEL-DOMAIN.vercel.app"
embedded = true

[build]
automatically_update_urls_on_dev = false
include_config_on_deploy = true

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app/uninstalled"

  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/webhooks/app/scopes_update"

  [[webhooks.subscriptions]]
  compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]
  uri = "/webhooks/compliance"

[access_scopes]
scopes = "read_discounts,write_discounts,read_shipping,read_markets"

[auth]
redirect_urls = [ "https://YOUR-VERCEL-DOMAIN.vercel.app/auth/callback" ]

