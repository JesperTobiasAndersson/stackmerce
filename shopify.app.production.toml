# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "2bf6876a2bbf4381c85973f61ddfa5cb"
name = "Discount"
application_url = "https://discount-app-437971048935.europe-west3.run.app"
embedded = true

[build]
automatically_update_urls_on_dev = false

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app/uninstalled"

  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/webhooks/app/scopes_update"

  [[webhooks.subscriptions]]
  compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]
  uri = "/webhooks/compliance"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
# read_discounts/write_discounts: manage automatic app discounts.
# read_shipping: list shipping methods for shipping-method targeting.
# read_markets: list markets for market targeting.
scopes = "read_discounts,write_discounts,read_shipping,read_markets"

[auth]
redirect_urls = [ "https://discount-app-437971048935.europe-west3.run.app/auth/callback" ]
