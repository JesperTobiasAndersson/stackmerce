# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "2bf6876a2bbf4381c85973f61ddfa5cb"
name = "Discount"
# TODO: replace with the production Vercel domain after the first deploy
# (e.g. https://discount-app.vercel.app or a custom domain), then run
# `shopify app deploy` so Shopify picks up the new URLs.
application_url = "https://YOUR-VERCEL-DOMAIN.vercel.app"
embedded = true

[build]
automatically_update_urls_on_dev = false
include_config_on_deploy = true

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app/uninstalled"

  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/webhooks/app/scopes_update"

  [[webhooks.subscriptions]]
  compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]
  uri = "/webhooks/compliance"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
# read_discounts/write_discounts: manage automatic app discounts.
# read_shipping: list shipping methods for shipping-method targeting.
# read_markets: list markets for market targeting.
scopes = "read_discounts,write_discounts,read_shipping,read_markets"

[auth]
redirect_urls = [ "https://YOUR-VERCEL-DOMAIN.vercel.app/auth/callback" ]
